<!DOCTYPE html>
<html lang="es">

<head>
  <script>
    (function () {
      try {

        var theme = localStorage.getItem('isa_theme') || 'light';

        document.documentElement.setAttribute(
          'data-color-scheme',
          theme
        );

      } catch (e) { }
    })();
  </script>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../../assets/vendor/fonts/boxicons.css" />
  <link rel="stylesheet" href="../../assets/vendor/css/core.css" class="template-customizer-core-css" />
  <link rel="stylesheet" href="../../assets/vendor/css/theme-default.css" class="template-customizer-theme-css" />
  <link rel="stylesheet" href="../../assets/vendor/css/dark-theme.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ISA Software - Tetris Logo</title>
  <link rel="stylesheet" href="../../assets/css/tetris-logo.css" />
  <style>
    body {
      display: flex;
      justify-content: center;
      /* Centrar horizontal */
      align-items: center;

      margin: 0;
      /* Quitar márgenes */
      background: #f9f9f9;
      /* Opcional, color de fondo */
    }
  </style>
</head>

</html>
